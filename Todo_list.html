<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lavender;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
            text-align: center;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 60%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            margin: 4px;
            background: #2348d8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        .task-text {
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>MY TO-DO List</h1>

        <input type="text" id="taskInput"
               placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>
    </div>

    <script>
        // Browser se saved tasks load karo
        let tasks = [];

        try {
            tasks = JSON.parse(
                localStorage.getItem("myTasks")
            ) || [];
        } catch (error) {
            tasks = [];
        }

        function saveTasks(){
            localStorage.setItem("myTasks",JSON.stringify(tasks));
        }

        // Saare tasks screen par show karo
        function displayTasks() {
            let taskList = document.getElementById("taskList");
            taskList.innerHTML = "";

            tasks.forEach(function(task, index) {
                let li = document.createElement("li");

                let taskText = document.createElement("span");
                taskText.textContent = task.text;
                taskText.className = "task-text";

                if (task.completed) {
                    taskText.classList.add("completed");
                }

                // Click karke complete ya undo karo
                taskText.onclick = function() {
                    tasks[index].completed =
                        !tasks[index].completed;

                    saveTasks();
                    displayTasks();
                };

                // Edit button
                let editBtn = document.createElement("button");
                editBtn.textContent = "Edit";

                editBtn.onclick = function() {
                    let updatedTask = prompt(
                        "Enter updated task:",
                        task.text
                    );

                    if (updatedTask !== null &&
                        updatedTask.trim() !== "") {

                        tasks[index].text = updatedTask.trim();
                        saveTasks();
                        displayTasks();
                    }
                };

                // Delete button
                let deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";

                deleteBtn.onclick = function() {
                    tasks.splice(index, 1);
                    saveTasks();
                    displayTasks();
                };

                li.appendChild(taskText);
                li.appendChild(editBtn);
                li.appendChild(deleteBtn);

                taskList.appendChild(li);
            });
        }

        // Naya task add karo
        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();
             
            saveTasks();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            tasks.push({
                text: task,
                completed: false
            });

            saveTasks();
            displayTasks();

            input.value = "";
        }

        // Enter key se bhi task add ho
        document.getElementById("taskInput")
            .addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    addTask();
                }
            });

        // Page open hote hi saved tasks dikhao
        displayTasks();
    </script>

</body>
